[package]
name = "dynamo-renderer"
readme = "README.md"
version = "7.1.1"
edition.workspace = true
description = "Standalone OpenAI chat-template / prompt formatting (HF chat_template via minijinja)."
authors.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
keywords = ["llm", "chat-template", "prompt", "jinja", "inference"]

[dependencies]
# The chat-template engine bridges OpenAI request types (dynamo-protocols) with
# the HF chat_template jinja engine (minijinja). `dynamo-tokenizers` supplies the
# public EncodeSegment type and is re-exported for consumers.
# Registry versions, as the published 7.1.1 declares them (`dynamo-protocols ^7.0.0`,
# `dynamo-tokenizers ^3.1.0`), not the workspace's path dependencies: this crate is consumed
# from git by the sglang fork's processor and sgl-router, and a path dependency inside a git
# source resolves to the checkout's own copy, which duplicates `dynamo_protocols` against the
# consumer's registry copy and breaks every trait bound on its request types.
dynamo-protocols = "7.0.0"
dynamo-tokenizers = "3.1.0"

anyhow = { workspace = true }
chrono = { workspace = true }
either = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
tracing = { workspace = true }

minijinja = { workspace = true, features = ["loader", "loop_controls"] }
minijinja-contrib = { workspace = true, features = ["pycompat"] }

[dev-dependencies]
tempfile = { workspace = true }
